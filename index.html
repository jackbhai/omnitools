<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="description" content="90+ free tools in one app: weather, music, travel, converters, calculators. No login, works offline." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Gurmukhi:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="OmniTools" />
<title>OmniTools - 90+ tools, no login</title>
<style>
/* Last-resort recovery screen — same friendly face as the in-app error
   boundary: what happened in plain words, a reload, and a reset that
   clears this app's saved data. No stack traces, ever. */
#error-display {
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  color: #E8FFF4;
  padding: 24px;
  font-family: "DM Sans", system-ui, sans-serif;
  font-size: 15px;
  z-index: 9999;
}
#error-display .box {
  max-width: 420px;
  margin: 12vh auto 0;
  background: #0E1412;
  border: 1px solid #1C2724;
  border-radius: 18px;
  padding: 22px;
}
#error-display h2 { margin: 0 0 8px; font-size: 19px; }
#error-display p { color: #9DB5AC; line-height: 1.55; margin: 0 0 16px; }
#error-display button {
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 12px 18px;
  background: linear-gradient(135deg, #00FF9C, #00E5FF);
  color: #00110A;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
}
#error-display button.ghost {
  background: #141C19;
  color: #E8FFF4;
  border: 1px solid #26332F;
  font-weight: 500;
}
</style>
</head>
<body>
<div id="error-display">
  <div class="box">
    <h2>Something went wrong</h2>
    <p id="error-message">The app could not start. Reloading usually fixes it. If it keeps happening, reset the app data — your settings and saved reading places will be cleared, nothing else on your phone is touched.</p>
    <button onclick="location.reload()">Reload</button>
    <button class="ghost" onclick="try{Object.keys(localStorage).filter(function(k){return k.indexOf('omni')===0}).forEach(function(k){localStorage.removeItem(k)});if(window.caches){caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).then(function(){location.reload()})}else{location.reload()}}catch(e){location.reload()}">Reset app data &amp; reload</button>
  </div>
</div>
<div id="root"></div>
<script>
// Last-resort error screen, for one situation only: the app never renders and
// a phone user is left staring at blank white with no console to check.
//
// It must NOT appear for anything else. The panel covers the whole viewport at
// z-index 9999, so putting it up over a working app makes every control
// untappable. That is exactly what was happening: any stray error - a dropped
// dev websocket, one unhandled rejection from a background fetch - raised the
// panel while the app was mounted and running fine underneath it. Measured: a
// tab click timed out after 30s because the stack-trace element was swallowing
// the pointer events.
//
// Two guards. First, an error that arrives before React mounts is normal, so
// the decision is deferred rather than taken immediately - by the time the
// timer fires the app has usually rendered and there is nothing to report.
// Second, it only ever shows if #root is still empty at that point.
(function () {
  var reported = false;

  function rendered() {
    var root = document.getElementById('root');
    return !!(root && root.children.length);
  }

  function report() {
    if (reported) return;
    reported = true;
    setTimeout(function () {
      if (rendered()) return;          // it recovered - stay out of the way
      var display = document.getElementById('error-display');
      if (!display) return;
      display.style.display = 'block'; // the box carries friendly copy only — no error text, no stack
    }, 4000);
  }

  window.onerror = function () { report(); return false; };

  window.onunhandledrejection = function () { report(); };
})();
</script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
